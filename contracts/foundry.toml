[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# Versión fija para que la verificación en el explorador sea reproducible.
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

[fmt]
line_length = 100
